name: Refresh layer snapshots
on:
  schedule:
    - cron: "17 9 1 * *"   # 1st of each month, 09:17 UTC (~4 AM Central)
  workflow_dispatch:
permissions:
  contents: write
concurrency: snapshots
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild snapshots from MnGeo
        run: python tools/build_static_layers.py
      - name: Rebuild trails (agency + OpenStreetMap)
        run: python tools/build_trails.py || echo "::warning::trails build failed; keeping last month's trails"
      - name: Sanity check and commit
        run: |
          set -e
          total=$(du -sm data/layers | cut -f1)
          echo "snapshot size: ${total} MB"
          if [ "$total" -gt 250 ]; then echo "snapshot unexpectedly large, not committing"; exit 1; fi
          for d in data/layers/*/; do [ -f "$d/index.json" ] || { echo "missing index in $d"; exit 1; }; done
          git config user.name "snapshot-refresher"
          git config user.email "actions@users.noreply.github.com"
          git add data/layers
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Layer snapshots refreshed $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
